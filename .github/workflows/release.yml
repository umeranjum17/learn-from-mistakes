name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm trusted publishing needs npm 11.5+; older Node 24 releases bundle an older npm.
      - name: Ensure npm 11.5+
        run: |
          echo "bundled npm: $(npm --version)"
          if [ "$(printf '%s\n%s\n' "$(npm --version)" '11.5.1' | sort -V | head -n1)" = '11.5.1' ]; then
            echo "npm $(npm --version) is 11.5 or newer"
          else
            npm install -g 'npm@^11.5.1'
            echo "now using npm: $(npm --version)"
          fi

      - name: Test
        run: npm test

      # A release is a version-bump PR; this publishes it. Without an OIDC
      # trusted-publisher link for this package and repo on npm, the publish
      # step fails and nothing is written to the registry.
      - name: Publish to npm if version is new
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if [ -n "$(npm view "${NAME}@${VERSION}" version 2>/dev/null)" ]; then
            echo "${NAME}@${VERSION} is already on npm; nothing to publish."
          else
            npm publish --provenance --access public
          fi
