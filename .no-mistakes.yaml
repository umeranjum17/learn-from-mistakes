commands:
  prepare: npm ci
  test: npm test
test:
  instructions: |
    Read CONSTRAINTS.md. Run only the npm tests for the changed parts, plus
    one user journey; CI runs the full suite on the PR. Pick the changed parts'
    test files from `git diff --name-only <base>...HEAD`: each changed
    test/*.test.mjs; the test named after a changed module (src/init.mjs ->
    test/init.test.mjs, src/check.mjs -> test/check.test.mjs, src/followup.mjs
    -> test/followup.test.mjs, src/sources/github.mjs -> test/github.test.mjs,
    src/runners/* -> test/runners.test.mjs, src/sessions/* or
    src/sources/sessions.mjs -> test/sessions.test.mjs); README.md, skills/ or
    scripts/build-skill.mjs -> test/conformance.test.mjs; any other changed
    src/ or bin/ file -> test/cli.test.mjs. Name the picked files and why.
    Then drive this candidate's done-done `cli` journey, the one user journey,
    with those files:
    LFM_VERIFY_TESTS="<picked test files>" DONE_DONE_HOME=<caller-specified private evidence dir> npx -y done-done-axi@0.3.0 run cli
    (model-free; the journey installs deps, runs `node --test <picked files>`
    in place of the full npm test, then the public CLI drives, and writes
    commands.json, result.json and identity.json into its own run folder
    there). With no test file picked, leave LFM_VERIFY_TESTS unset (the full
    suite runs). Reuse the existing npm test journeys; do not
    add per-function tests. Private source verification requires explicit caller
    opt-in and private output. Record candidate/source identities, input hashes,
    command exits and limitations. This text is injected only from the trusted
    default branch; report trusted consumption not proven until the emitted Test
    prompt/agent logs show it.
  evidence:
    store_in_repo: false
    attach_media: false
no_ci: false
